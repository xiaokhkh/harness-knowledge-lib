name: Deploy handbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify examples in the Docker sandbox
        run: |
          sandbox_log=$(mktemp)
          node dist/agent-harness-sandbox.mjs >"$sandbox_log" 2>&1 &
          sandbox_pid=$!
          trap 'kill "$sandbox_pid" 2>/dev/null || true' EXIT
          trap 'cat "$sandbox_log"' ERR
          for attempt in {1..180}; do
            if curl -fsS --max-time 1 http://127.0.0.1:41737/api/sandbox >/dev/null 2>&1; then
              break
            fi
            kill -0 "$sandbox_pid"
            sleep 1
          done
          npm run test:live
      - name: Prepare public page
        run: |
          mkdir _site
          cp dist/agent-harness-lab.html _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
